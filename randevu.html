<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Randevu al | Bahri Taşdemir</title>
<meta name="description" content="Bahri Taşdemir online randevu: hizmetinizi, ustanızı ve saatinizi seçin.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=2">
</head>
<body>
<div class="page">

  <header class="topbar">
    <a class="icon-btn" id="back" href="index.html" aria-label="Ana sayfaya dön">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="index.html" aria-label="Bahri Taşdemir ana sayfa"><img src="assets/img/logo-header.png" alt="Bahri Taşdemir" width="143" height="40"></a>
    <a class="icon-btn" href="https://wa.me/message/EVRYNRY2BHM4N1" target="_blank" rel="noopener" aria-label="WhatsApp'tan yazın">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </a>
  </header>

  <p class="demo" id="demo" hidden><b>DEMO</b>Randevular şimdilik yalnızca bu cihazda saklanır, salona ulaşmaz.</p>

  <main>
    <div id="form" style="display: flex; flex-direction: column; flex-grow: 1">
      <section class="intro tight">
        <div class="eyebrow line" id="branch-name"></div>
        <h1 class="h-page">Randevu</h1>
        <p class="lead">Hizmetinizi, ustanızı ve saatinizi seçin.</p>
      </section>

      <section class="step">
        <div class="step-head"><span class="n">01</span><h2>HİZMET SEÇİMİ</h2></div>
        <div class="seg" id="genders" role="group" aria-label="Bölüm"></div>
        <div class="chips" id="chips" aria-label="Seçilen hizmetler"></div>
        <div class="tabs" id="cats" role="group" aria-label="Kategori"></div>
        <div class="menu" id="rows"></div>
      </section>

      <section class="step">
        <div class="step-head"><span class="n">02</span><h2>PERSONEL SEÇİMİ</h2></div>
        <div class="staff" id="staff"></div>
        <p class="hint" id="staff-note" hidden></p>
      </section>

      <section class="step flush">
        <div class="step-head"><span class="n">03</span><h2>TARİH SEÇİMİ</h2></div>
        <div class="days" id="days"></div>
        <p class="hint" id="day-note"></p>
      </section>

      <section class="step">
        <div class="step-head"><span class="n">04</span><h2>SAAT SEÇİMİ</h2></div>
        <div class="slots" id="slots"></div>
        <p class="hint">Üstü çizili saatler dolu ya da geçmiş.</p>
      </section>

      <section class="step">
        <div class="step-head"><span class="n">05</span><h2>BİLGİLERİNİZ</h2></div>
        <div class="fields">
          <div class="field">
            <label for="ad">AD SOYAD</label>
            <input id="ad" type="text" autocomplete="name" maxlength="60">
          </div>
          <div class="field">
            <label for="tel">CEP TELEFONU</label>
            <input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
          </div>
        </div>
      </section>

      <section class="finish">
        <div class="sum" id="sum"></div>
        <p class="alert" id="err" role="alert" hidden></p>
        <button type="button" class="btn" id="go">RANDEVUYU ONAYLA</button>
        <p class="fine" id="foot-note" style="text-align: center"></p>
      </section>
    </div>

    <div id="done" hidden>
      <section class="done" role="status">
        <div class="eyebrow">RANDEVU</div>
        <h2>Randevunuz alındı</h2>
        <div class="sum" id="done-sum"></div>
        <p class="fine" id="done-note"></p>
      </section>
      <div class="finish" style="padding-top: 24px">
        <a class="btn outline" href="index.html">ANA SAYFAYA DÖN</a>
      </div>
    </div>
  </main>

</div>
<script src="assets/data.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
<script src="assets/config.js"></script>
<script src="assets/store.js?v=2"></script>
<script src="assets/randevu.js?v=2"></script>
</body>
</html>
